name: android-apk
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "debug = test build (debug-signed); release = versioned (release keystore)"
        type: choice
        default: debug
        options: [debug, release]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK + platform (preinstalled SDK)
        run: |
          SdkMgr="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SdkMgr" --licenses > /dev/null
          "$SdkMgr" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk
      - name: Restore release keystore
        if: inputs.profile == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/procraft-release.keystore
          ls -la /tmp/procraft-release.keystore
      - name: Build APK
        run: cargo apk build ${{ inputs.profile == 'release' && '--release' || '' }} -p procraft --lib
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973
          # Debug .so carries full debuginfo (~300MB APK); strip symbols for
          # a sideloadable test build. Release profile strips via Cargo.
          # max-page-size=16384 (issue #2): 4KB-aligned .so is killed at load
          # on 16KB-page Android 15 devices — instant crash, no stack.
          RUSTFLAGS: ${{ inputs.profile == 'release' && '-C link-arg=-Wl,-z,max-page-size=16384' || '-C strip=symbols -C link-arg=-Wl,-z,max-page-size=16384' }}
          CARGO_APK_RELEASE_KEYSTORE: /tmp/procraft-release.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      - name: Verify + stage APK
        run: |
          set -euxo pipefail
          APK=$(find target -name '*.apk' ! -name '*unaligned*' | head -n 1)
          test -n "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$APK" | head -n 8
          "$BT/apksigner" verify --print-certs "$APK" | head -n 4
          # Issue #2 proof: non-empty launcher icon + application label.
          # (Strict: icon='res/ — a bare icon= also matches icon='', which
          # is how the first attempt passed vacuously.)
          "$BT/aapt" dump badging "$APK" | grep -q "icon='res/" || (echo "NO LAUNCHER ICON" && exit 1)
          "$BT/aapt" dump badging "$APK" | grep -q "application-label:'ProCraft'" || (echo "NO APP LABEL" && exit 1)
          VER=$(grep '^version' Cargo.toml | head -n 1 | cut -d'"' -f2)
          if [ "${{ inputs.profile }}" = "release" ]; then OUT="ProCraft-android-v$VER.apk"; else OUT="ProCraft-android-v1.apk"; fi
          cp "$APK" "$OUT"
          ls -la "$OUT"
          # Issue #2 proof: arm64 .so must carry 16KB-aligned LOAD segments,
          # or 16KB-page Android 15 devices kill the app at startup.
          OUT="$OUT" python3 - <<'EOF'
          import os, struct, sys, zipfile
          z = zipfile.ZipFile(os.environ["OUT"])
          data = z.read("lib/arm64-v8a/libprocraft_app.so")
          phoff = struct.unpack("<Q", data[0x20:0x28])[0]
          phentsize, phnum = struct.unpack("<HH", data[0x36:0x3A])
          top = 0
          for i in range(phnum):
              o = phoff + i * phentsize
              f = struct.unpack("<IIQQQQQQ", data[o:o + 56])
              if f[0] == 1:
                  top = max(top, f[7])
          print("max PT_LOAD align:", top)
          sys.exit(0 if top >= 16384 else 1)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ProCraft-android-*.apk
