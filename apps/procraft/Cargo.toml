[package]
name = "procraft"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "ProCraft painting studio (egui desktop app)"

[lib]
name = "procraft_app"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "procraft"
path = "src/main.rs"

[dependencies]
procraft-engine = { path = "../../crates/engine" }
egui = "0.36"
image = "0.25"

# Desktop windowing + dialogs.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
eframe = "0.36"
rfd = "0.17"

# iOS: glutin (eframe's glow backend) has no iOS support, so the iOS build
# drops "glow" and always uses wgpu (Metal); rfd has no iOS backend either
# and swaps for a no-op local shim with the same call shape.
[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence", "links"] }
rfd-shim = { path = "../../crates/rfd-shim" }

# Android: same wgpu recipe as iOS (glow has no mobile backend) with the
# native-activity entry; `accesskit` is unavailable with native-activity so
# it stays out. File dialogs reuse the declining shim until the Storage
# Access bridge lands (see the File-menu note in `src/lib.rs`).
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity", "wayland", "x11", "persistence", "links"] }
rfd-shim = { path = "../../crates/rfd-shim" }
android-activity = "0.6"

# cargo-apk packaging (sideload APK, same model as the iOS IPA workflow).
[package.metadata.android]
package = "com.surfrpt1.procraft"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[package.metadata.android.application]
label = "ProCraft"
