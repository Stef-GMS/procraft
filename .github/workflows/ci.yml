name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test engine
        run: cargo test -p procraft-engine
      - name: Build app
        run: cargo build -p procraft
