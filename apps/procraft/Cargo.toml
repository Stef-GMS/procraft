[package]
name = "procraft"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "ProCraft painting studio (egui desktop app)"

[[bin]]
name = "procraft"
path = "src/main.rs"

[dependencies]
procraft-engine = { path = "../../crates/engine" }
egui = "0.36"
image = "0.25"

# Desktop windowing + dialogs.
[target.'cfg(not(target_os = "ios"))'.dependencies]
eframe = "0.36"
rfd = "0.17"

# iOS: glutin (eframe's glow backend) has no iOS support, so the iOS build
# drops "glow" and always uses wgpu (Metal); rfd has no iOS backend either
# and swaps for a no-op local shim with the same call shape.
[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence", "links"] }
rfd-shim = { path = "../../crates/rfd-shim" }
