name: android-apk
on:
  workflow_dispatch: {}
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK + platform (preinstalled SDK)
        run: |
          SdkMgr="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SdkMgr" --licenses > /dev/null
          "$SdkMgr" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk
      - name: Build test APK (debug, stripped)
        run: cargo apk build -p procraft --lib
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973
          # Debug .so carries full debuginfo (~300MB APK); strip symbols for
          # a sideloadable test build. Release signing (real keystore) waits
          # for the next versioned release.
          RUSTFLAGS: -C strip=symbols
      - name: Verify + stage APK
        run: |
          set -euxo pipefail
          APK=$(find target -name '*.apk' | head -n 1)
          test -n "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$APK" | head -n 8
          "$BT/apksigner" verify --print-certs "$APK" | head -n 4
          cp "$APK" ProCraft-android-v1.apk
          ls -la ProCraft-android-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ProCraft-android-v1.apk
          path: ProCraft-android-v1.apk
